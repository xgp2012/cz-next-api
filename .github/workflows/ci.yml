name: CI

# 什么时候跑：
#   - 推 main
#   - 提 PR（PR 也值得跑，否则问题要等合并后才发现）
on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_dispatch:

jobs:
  unit_tests:
    name: "Unit tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # 与 go.mod 的 `go 1.20` 对齐；用 ^1.20 会拿到最新的 1.x，
          # 那会引入与本地不一致的语法/工具链行为，CI 与本地结果对不上。
          go-version-file: go.mod

      # 关键：web/build 是被 .gitignore 忽略的构建产物，仓库里只有 .gitkeep。
      # main.go 有 `//go:embed all:web/build/*`，缺少真实产物时**编译不会报错**
      # （.gitkeep 恰好能被通配匹配到），但构建出来的二进制里没有任何前端资源，
      # 启动后访问首页是空白——这种"绿色 CI + 坏产物"最容易漏到线上。
      # 因此这里显式造一个占位 index.html，让编译与测试能跑；
      # 真正的完整前端由 Docker 构建流程负责生成。
      - name: Stub web/build for embed
        run: |
          mkdir -p web/build/default
          echo '<html><body>ci stub</body></html>' > web/build/default/index.html

      # 说明：
      #   - common/image 的 TestDecode 需要联网下载 Wikimedia 图片，
      #     在受限网络下会失败，且与本项目逻辑无关，因此排除该包。
      #   - 其余包全部跑，并输出覆盖率。
      - name: Test
        run: |
          go test -cover -coverprofile=coverage.txt \
            $(go list ./... | grep -v '/common/image$')

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.txt
          if-no-files-found: ignore

  commit_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
